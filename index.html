<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#0f1117;color:#e8eaf0;min-height:100vh;padding:32px 24px;}
h1{font-family:'DM Mono',monospace;font-size:1.3rem;font-weight:500;color:#7ecfaa;letter-spacing:0.05em;}
.subtitle{font-size:0.82rem;color:#8a95a8;margin-top:4px;}
header{margin-bottom:32px;}

/* Plans grid */
.plans-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:32px;}
.plan-card{background:#181c28;border:1px solid #3a4258;border-radius:10px;padding:18px 20px;cursor:pointer;transition:border-color 0.15s,background 0.15s;text-decoration:none;display:block;}
.plan-card:hover{border-color:#7ecfaa;background:#1e2336;}
.plan-card-profile{font-size:0.68rem;font-family:'DM Mono',monospace;color:#7ecfaa;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.plan-card-title{font-size:1.05rem;font-weight:700;color:#e8eaf0;margin-bottom:4px;}
.plan-card-date{font-size:0.78rem;color:#8a95a8;}
.plan-card-meta{font-size:0.72rem;color:#4a5570;margin-top:8px;font-family:'DM Mono',monospace;}

/* New plan button */
.btn-new{display:inline-flex;align-items:center;gap:8px;background:#1a6b4a;border:none;color:#fff;
  padding:10px 22px;border-radius:7px;cursor:pointer;font-size:0.88rem;font-family:'DM Sans',sans-serif;
  font-weight:600;transition:background 0.15s;}
.btn-new:hover{background:#228b5e;}

/* Modal */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:50;align-items:center;justify-content:center;}
#modal-overlay.open{display:flex;}
#modal{background:#181c28;border:1px solid #3a4258;border-radius:12px;padding:28px 28px 24px;width:min(480px,95vw);max-height:90vh;overflow-y:auto;}
#modal h2{font-family:'DM Mono',monospace;font-size:1rem;color:#7ecfaa;margin-bottom:20px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:0.78rem;color:#8a95a8;margin-bottom:6px;font-weight:500;}
.field input,.field select{width:100%;background:#12151f;border:1px solid #3a4258;border-radius:6px;
  color:#e8eaf0;font-family:'DM Sans',sans-serif;font-size:0.88rem;padding:9px 12px;}
.field input:focus,.field select:focus{outline:none;border-color:#7ecfaa;}
.field select option{background:#181c28;}
.negated-row{display:flex;gap:8px;align-items:center;}
.negated-row input{flex:1;}
#negated-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.neg-chip{background:#1e2336;border:1px solid #3a4258;border-radius:4px;padding:3px 8px;
  font-size:0.75rem;color:#c0c8d8;display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;}
.neg-chip button{background:none;border:none;color:#8a95a8;cursor:pointer;font-size:0.85rem;padding:0;line-height:1;}
.neg-chip button:hover{color:#e07070;}
.modal-actions{display:flex;align-items:center;gap:12px;margin-top:24px;padding-top:16px;border-top:1px solid #3a4258;}
.btn-primary{background:#1a6b4a;border:none;color:#fff;padding:9px 22px;border-radius:6px;
  cursor:pointer;font-size:0.88rem;font-family:'DM Sans',sans-serif;font-weight:600;}
.btn-primary:hover{background:#228b5e;}
.btn-primary:disabled{opacity:0.5;cursor:default;}
.btn-cancel{background:none;border:1px solid #3a4258;color:#8a95a8;padding:9px 18px;border-radius:6px;
  cursor:pointer;font-size:0.88rem;font-family:'DM Sans',sans-serif;}
.btn-cancel:hover{border-color:#8a95a8;color:#e8eaf0;}
#modal-status{font-size:0.78rem;color:#7ecfaa;font-family:'DM Mono',monospace;}

.empty-state{color:#4a5570;font-size:0.88rem;padding:20px 0;}
.loading{color:#4a5570;font-size:0.85rem;font-family:'DM Mono',monospace;}
</style>
</head>
<body>

<header>
  <h1>Course Planner</h1>
  <p class="subtitle">Military Aviation Apprenticeship — TG5 Maths</p>
</header>

<div id="plans-container" class="loading">Loading plans…</div>

<button class="btn-new" id="btn-new-plan">＋ Create new plan</button>

<!-- New Plan Modal -->
<div id="modal-overlay">
  <div id="modal">
    <h2>Create new plan</h2>
    <div class="field">
      <label>Profile</label>
      <select id="f-profile">
        <option value="TG5">TG5 (2208A / 2209A / 2211A)</option>
        <option value="TG1" disabled>TG1 — coming soon</option>
      </select>
    </div>
    <div class="field">
      <label>Course number</label>
      <input id="f-course" type="text" placeholder="e.g. 088" maxlength="10">
    </div>
    <div class="field">
      <label>Start date (first day of course)</label>
      <input id="f-start" type="date">
    </div>
    <div class="field">
      <label>Start slot <span style="font-size:0.72rem;color:#4a5570">(if Intro to APO starts late, everything shifts right from here)</span></label>
      <select id="f-start-slot">
        <option value="am1">AM 1 (08:30) — normal start</option>
        <option value="am2">AM 2 (10:30) — skip AM 1</option>
        <option value="pm1">PM 1 (13:30) — skip AM 1 & AM 2</option>
        <option value="pm2">PM 2 (15:30) — afternoon only</option>
      </select>
    </div>
    <div class="field">
      <label>Negated days (Air Days, bank holidays, leave, travel)</label>
      <div style="display:flex;gap:6px;margin-bottom:6px;">
        <input id="f-neg-label" type="text" placeholder="Label (e.g. Air Day, Easter leave…)" style="flex:2">
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        <input id="f-neg-from" type="date" style="flex:1;min-width:130px">
        <span style="font-size:0.78rem;color:#8a95a8;white-space:nowrap">to</span>
        <input id="f-neg-to" type="date" style="flex:1;min-width:130px">
        <button class="btn-cancel" id="btn-add-neg" style="white-space:nowrap">Add</button>
      </div>
      <div style="font-size:0.7rem;color:#4a5570;margin-top:4px;font-family:'DM Mono',monospace;">Leave "to" blank for a single day</div>
      <div id="negated-list"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="btn-create">Generate plan</button>
      <button class="btn-cancel" id="btn-cancel">Cancel</button>
      <span id="modal-status"></span>
    </div>
  </div>
</div>

<script src="tg5_template.js"></script>
<script>
const _sb = supabase.createClient(
  'https://znaqeoqgpqrsifmbmijf.supabase.co',
  'sb_publishable_L8g1B1mvRFqMSS3zGyukzA_da38oc-4'
);

// ── Load & display plans ──────────────────────────────────────────────────────
async function loadPlans() {
  const { data, error } = await _sb.from('plans')
    .select('slug,profile,course_number,start_date,created_at')
    .order('start_date', { ascending: false });

  const el = document.getElementById('plans-container');
  if (error || !data || !data.length) {
    el.innerHTML = '<p class="empty-state">No plans yet — create one below.</p>';
    el.className = '';
    return;
  }
  el.className = 'plans-grid';
  el.innerHTML = data.map(p => {
    const d = new Date(p.start_date + 'T12:00:00');
    const fmt = d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
    return `<a class="plan-card" href="plan.html?plan=${p.slug}">
      <div class="plan-card-profile">${p.profile}</div>
      <div class="plan-card-title">${p.profile} ${p.course_number}</div>
      <div class="plan-card-date">Starting ${fmt}</div>
      <div class="plan-card-meta">${p.slug}</div>
    </a>`;
  }).join('');
}

loadPlans();

// ── Negated days ──────────────────────────────────────────────────────────────
// Each entry: { label, dates: [iso, iso, ...] }
let negatedEntries = [];

function dateRange(from, to) {
  const days = [];
  const cur = new Date(from + 'T12:00:00');
  const end = new Date((to || from) + 'T12:00:00');
  while (cur <= end) { days.push(cur.toISOString().split('T')[0]); cur.setDate(cur.getDate() + 1); }
  return days;
}

function renderNegated() {
  document.getElementById('negated-list').innerHTML = negatedEntries.map((e, i) => {
    const fmtD = d => new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    const span = e.dates.length === 1
      ? fmtD(e.dates[0])
      : fmtD(e.dates[0]) + ' – ' + fmtD(e.dates[e.dates.length-1]);
    const lbl = e.label ? `<strong>${e.label}</strong> ` : '';
    return `<span class="neg-chip">${lbl}${span} <span style="color:#4a5570">(${e.dates.length}d)</span><button data-i="${i}">✕</button></span>`;
  }).join('');
  document.querySelectorAll('.neg-chip button').forEach(b => {
    b.addEventListener('click', () => {
      negatedEntries.splice(parseInt(b.dataset.i), 1);
      renderNegated();
    });
  });
}

document.getElementById('btn-add-neg').addEventListener('click', () => {
  const from = document.getElementById('f-neg-from').value;
  const to   = document.getElementById('f-neg-to').value;
  const label= document.getElementById('f-neg-label').value.trim();
  if (!from) return;
  const dates = dateRange(from, to || from);
  negatedEntries.push({ label, dates });
  renderNegated();
  document.getElementById('f-neg-from').value = '';
  document.getElementById('f-neg-to').value   = '';
  document.getElementById('f-neg-label').value = '';
});

// ── Plan generator ────────────────────────────────────────────────────────────
function generateWorkingDays(startDate, count, negated) {
  const neg = new Set(negated);
  const days = [];
  const cur = new Date(startDate + 'T12:00:00');
  while (days.length < count) {
    const dow = cur.getDay(); // 0=Sun,6=Sat
    const iso = cur.toISOString().split('T')[0];
    if (dow >= 1 && dow <= 5 && !neg.has(iso)) {
      days.push(iso);
    }
    cur.setDate(cur.getDate() + 1);
  }
  return days;
}

const SLOT_ORDER = ['am1', 'am2', 'pm1', 'pm2']; // teachable slots in order
function buildTimetableData(template, startDate, negated, startSlot) {
  // Flatten template to an ordered sequence of slot contents
  const contents = [];
  template.forEach(daySlots => {
    [...daySlots]
      .sort((a, b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot))
      .forEach(s => contents.push(s));
  });

  // Build ordered list of (date, slot) positions starting from startSlot on day 1
  const startIdx = SLOT_ORDER.indexOf(startSlot || 'am1');
  // Generate a few extra days as buffer for the rightward shift
  const workingDays = generateWorkingDays(startDate, template.length + 3, negated);
  const positions = [];
  workingDays.forEach((date, dayIdx) => {
    const slots = dayIdx === 0 ? SLOT_ORDER.slice(startIdx) : SLOT_ORDER;
    slots.forEach(slot => positions.push({ date, slot }));
  });

  // Place each content item into the next available position
  const data = {};
  contents.forEach((content, i) => {
    if (i >= positions.length) return;
    const { date, slot } = positions[i];
    data[date + '_' + slot] = Object.assign({}, content, { date, slot });
  });
  return data;
}

// ── Modal ─────────────────────────────────────────────────────────────────────
document.getElementById('btn-new-plan').addEventListener('click', () => {
  negatedEntries = [];
  renderNegated();
  document.getElementById('f-course').value = '';
  document.getElementById('f-start').value = '';
  document.getElementById('f-start-slot').value = 'am1';
  document.getElementById('modal-status').textContent = '';
  document.getElementById('modal-overlay').classList.add('open');
});

document.getElementById('btn-cancel').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('open');
});

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
});

document.getElementById('btn-create').addEventListener('click', async () => {
  const profile    = document.getElementById('f-profile').value;
  const courseNum  = document.getElementById('f-course').value.trim().toUpperCase();
  const startDate  = document.getElementById('f-start').value;
  const startSlot  = document.getElementById('f-start-slot').value;
  const status     = document.getElementById('modal-status');
  const btn        = document.getElementById('btn-create');

  if (!courseNum) { status.textContent = 'Enter a course number'; return; }
  if (!startDate) { status.textContent = 'Enter a start date'; return; }

  const slug = profile + '-' + courseNum;
  const template = profile === 'TG5' ? TG5_TEMPLATE : null;
  if (!template) { status.textContent = 'Profile not yet available'; return; }

  btn.disabled = true;
  status.textContent = 'Generating…';

  const negatedDays = negatedEntries.flatMap(e => e.dates);
  const timetableData = buildTimetableData(template, startDate, negatedDays, startSlot);

  try {
    const { error } = await _sb.from('plans').insert({
      slug,
      profile,
      course_number: courseNum,
      start_date: startDate,
      negated_days: negatedEntries,
      timetable_data: timetableData,
    });

    if (error) {
      status.textContent = error.code === '23505' ? 'Plan already exists: ' + slug : 'DB error: ' + error.message;
      btn.disabled = false;
      return;
    }

    window.location.href = 'plan.html?plan=' + slug;
  } catch (err) {
    status.textContent = 'Network error: ' + (err.message || err);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
