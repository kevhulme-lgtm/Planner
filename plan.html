<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Planner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#0f1117;color:#e8eaf0;padding:20px;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:0.78rem;color:#8a95a8;text-decoration:none;margin-bottom:14px;font-family:'DM Mono',monospace;}
.back-link:hover{color:#7ecfaa;}
h1{font-family:'DM Mono',monospace;font-size:1.2rem;font-weight:500;letter-spacing:0.05em;color:#7ecfaa;margin-bottom:6px;}
.subtitle{font-size:0.8rem;color:#8a95a8;margin-bottom:16px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;padding:10px 14px;background:#181c28;border:1px solid #3a4258;border-radius:8px;}
.legend-item{display:flex;align-items:center;gap:7px;font-size:0.75rem;color:#c0c8d8;font-weight:500;}
.legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
.nav{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.nav button{background:#252b3d;border:1px solid #4a5570;color:#e0e6f0;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:0.85rem;font-family:'DM Sans',sans-serif;font-weight:500;transition:all 0.15s;}
.nav button:hover{background:#2e3650;border-color:#6a7a9a;}
.nav button:disabled{opacity:0.3;cursor:default;}
.week-label{font-family:'DM Mono',monospace;font-size:0.95rem;color:#e8eaf0;min-width:130px;text-align:center;font-weight:500;}
.week-range{font-size:0.78rem;color:#8a95a8;}
.save-indicator{font-size:0.72rem;color:#4a5570;font-family:'DM Mono',monospace;margin-left:auto;}
.zoom-controls{display:flex;align-items:center;gap:6px;margin-left:10px;}
.zoom-controls button{background:#252b3d;border:1px solid #4a5570;color:#e0e6f0;width:28px;height:28px;border-radius:5px;cursor:pointer;font-size:1rem;line-height:1;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;}
.zoom-controls button:hover{background:#2e3650;border-color:#6a7a9a;}
#zoomLabel{font-family:'DM Mono',monospace;font-size:0.75rem;color:#8a95a8;min-width:38px;text-align:center;}
.save-indicator.saving{color:#8a95a8;}
.save-indicator.saved{color:#7ecfaa;}
.grid{display:grid;grid-template-columns:80px repeat(5,1fr);gap:3px;background:#3a4258;border-radius:10px;overflow:hidden;border:2px solid #3a4258;min-width:600px;}
.grid-wrap{overflow-x:auto;}
.grid-header{background:#1e2336;padding:9px 6px;font-size:0.72rem;color:#8a95a8;font-family:'DM Mono',monospace;text-align:center;border-bottom:2px solid #3a4258;}
.day-header{color:#e0e6f0;font-size:0.78rem;font-weight:600;}
.date-sub{font-size:0.65rem;color:#7a85a0;margin-top:3px;}
.slot-label{background:#1e2336;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px solid #3a4258;}
.slot-name{font-size:0.68rem;font-family:'DM Mono',monospace;color:#c0c8d8;font-weight:500;}
.slot-time{font-size:0.6rem;color:#6a75a0;margin-top:2px;}
.cell{min-height:52px;padding:5px 7px;transition:all 0.1s;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
#drag-ghost{display:none;position:fixed;pointer-events:none;z-index:9999;padding:7px 12px;border-radius:6px;font-size:0.78rem;font-family:'DM Sans',sans-serif;font-weight:600;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:2px solid #7ecfaa;opacity:0.9;box-shadow:0 4px 16px rgba(0,0,0,0.5);}
.cell-empty{background:#12151f;}
.cell-empty.drag-over{outline:2px dashed #7ecfaa;outline-offset:-2px;background:#1a2030;}
.cell-other{background:#1c2030;display:flex;align-items:center;justify-content:center;}
.cell-other-label{font-size:0.72rem;color:#8a95b8;text-align:center;line-height:1.4;padding:2px;font-weight:500;}
.cell-ped{background:#2a1f0a;display:flex;align-items:center;justify-content:center;border-left:4px solid #d4870a;}
.cell-ped-label{font-size:0.72rem;color:#f0a830;text-align:center;line-height:1.4;padding:2px;font-weight:600;}
.cell-exam-other{background:#2a1018;display:flex;align-items:center;justify-content:center;border-left:4px solid #8b2020;}
.cell-exam-other-label{font-size:0.72rem;color:#e07070;text-align:center;line-height:1.4;padding:2px;font-weight:500;}
.cell-maths{cursor:grab;display:flex;flex-direction:column;gap:3px;}
.cell-maths:active{cursor:grabbing;opacity:0.8;}
.cell-maths.drag-over{outline:2px dashed #7ecfaa;outline-offset:-2px;}
.cell-maths.done{opacity:0.55;}
.cell-maths.done .cell-main{text-decoration:line-through;color:#6a7a7a;}
.cell-maths.cut-mode{outline:2px dashed #f0a830;outline-offset:-2px;animation:pulse-cut 1s infinite;}
@keyframes pulse-cut{0%,100%{outline-color:#f0a830;}50%{outline-color:#7ecfaa;}}
.cell-tag{font-size:0.58rem;font-family:'DM Mono',monospace;color:white;padding:2px 6px;border-radius:3px;font-weight:600;letter-spacing:0.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell-main{font-size:0.75rem;color:#1a1a1a;font-weight:600;line-height:1.3;flex:1;}
.cell-period{font-size:0.62rem;font-family:'DM Mono',monospace;color:#4a5570;margin-top:auto;font-weight:500;}
.cell-main-exam{font-size:0.75rem;color:#fff;font-weight:600;line-height:1.3;flex:1;}
.cell-period-exam{font-size:0.62rem;font-family:'DM Mono',monospace;color:#ffaaaa;margin-top:auto;font-weight:500;}
.cell-done-badge{position:absolute;top:4px;right:4px;font-size:0.65rem;background:#1a6b4a;color:#7ecfaa;border-radius:3px;padding:1px 5px;font-family:'DM Mono',monospace;font-weight:600;}
.cell-airday{background:#0e1a2e;display:flex;align-items:center;justify-content:center;border-left:4px solid #1a4a7a;}
.cell-airday-label{font-size:0.72rem;color:#4a8abf;text-align:center;line-height:1.4;padding:2px;font-weight:600;letter-spacing:0.04em;}
#loading-state{color:#4a5570;font-family:'DM Mono',monospace;font-size:0.85rem;padding:40px 0;}
/* PANEL */
#panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;}
#panel-overlay.open{display:block;}
#lesson-panel{position:fixed;top:0;right:-740px;width:min(740px,100vw);height:100vh;background:#12151f;border-left:2px solid #3a4258;display:flex;flex-direction:column;z-index:101;transition:right 0.25s ease;}
#lesson-panel.open{right:0;}
#panel-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#181c28;border-bottom:1px solid #3a4258;flex-shrink:0;flex-wrap:wrap;}
#panel-klp-ref{font-family:'DM Mono',monospace;font-size:0.7rem;color:#7ecfaa;white-space:nowrap;}
#panel-klp-title{font-size:0.88rem;font-weight:600;color:#e8eaf0;flex:1;min-width:120px;}
#panel-period{font-family:'DM Mono',monospace;font-size:0.7rem;color:#8a95a8;white-space:nowrap;}
.panel-hdr-btn{background:none;border:1px solid #3a4258;color:#8a95a8;font-size:0.75rem;padding:3px 10px;border-radius:4px;cursor:pointer;font-family:'DM Mono',monospace;flex-shrink:0;white-space:nowrap;}
.panel-hdr-btn:hover{border-color:#7ecfaa;color:#7ecfaa;}
.panel-hdr-btn.active{border-color:#7ecfaa;color:#7ecfaa;}
#panel-close{background:none;border:none;color:#8a95a8;font-size:1.3rem;cursor:pointer;padding:0 2px;line-height:1;flex-shrink:0;}
#panel-close:hover{color:#e8eaf0;}
#panel-override-row{display:flex;align-items:center;gap:6px;padding:7px 14px;background:#12151f;border-bottom:1px solid #3a4258;flex-shrink:0;}
#panel-override-input{flex:1;background:#1c2030;border:1px solid #3a4258;border-radius:5px;color:#e8eaf0;font-family:'DM Sans',sans-serif;font-size:0.82rem;padding:5px 10px;}
#panel-override-input:focus{outline:none;border-color:#7ecfaa;}
#panel-tabs{display:flex;align-items:stretch;background:#181c28;border-bottom:1px solid #3a4258;flex-shrink:0;}
.panel-tab{padding:8px 14px;font-size:0.78rem;cursor:pointer;color:#8a95a8;border-bottom:2px solid transparent;font-weight:500;white-space:nowrap;}
.panel-tab.active{color:#7ecfaa;border-bottom-color:#7ecfaa;}
#panel-book-link{margin-left:auto;align-self:center;padding:0 14px;font-size:0.73rem;color:#5a8fcc;text-decoration:none;}
#panel-book-link:hover{color:#7ecfaa;}
#panel-body{flex:1;overflow:hidden;display:flex;flex-direction:column;}
#panel-book-frame{width:100%;flex:1;border:none;display:none;background:#fff;}
#panel-book-frame.active{display:block;}
#panel-notes-tab,#panel-links-tab{display:none;flex-direction:column;flex:1;padding:14px;gap:8px;overflow-y:auto;}
#panel-notes-tab.active,#panel-links-tab.active{display:flex;}
#panel-lp-tab{display:none;flex-direction:column;flex:1;overflow:hidden;}
#panel-lp-tab.active{display:flex;}
#panel-lp-set-row{display:flex;gap:6px;padding:10px 14px;background:#181c28;border-bottom:1px solid #3a4258;flex-shrink:0;align-items:center;}
#lp-url-input{flex:1;background:#1c2030;border:1px solid #3a4258;border-radius:5px;color:#e8eaf0;font-family:'DM Sans',sans-serif;font-size:0.82rem;padding:5px 10px;}
#lp-url-input:focus{outline:none;border-color:#7ecfaa;}
#panel-lp-frame{width:100%;flex:1;border:none;display:none;background:#fff;}
#panel-lp-frame.active{display:block;}
#panel-notes-label{font-size:0.72rem;color:#8a95a8;font-family:'DM Mono',monospace;}
#panel-notes{flex:1;background:#1c2030;border:1px solid #3a4258;border-radius:6px;color:#e8eaf0;font-family:'DM Sans',sans-serif;font-size:0.87rem;padding:12px;resize:none;line-height:1.65;min-height:120px;}
#panel-notes:focus{outline:none;border-color:#7ecfaa;}
.notes-actions{display:flex;align-items:center;gap:10px;}
.btn-save{background:#1a6b4a;border:none;color:#fff;padding:7px 18px;border-radius:6px;cursor:pointer;font-size:0.82rem;font-family:'DM Sans',sans-serif;font-weight:500;}
.btn-save:hover{background:#228b5e;}
.tab-status{font-size:0.72rem;color:#7ecfaa;font-family:'DM Mono',monospace;}
.link-item{display:flex;align-items:center;gap:8px;background:#1c2030;border:1px solid #3a4258;border-radius:6px;padding:8px 10px;flex-shrink:0;}
.link-item-label{flex:1;font-size:0.83rem;color:#e8eaf0;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.link-item-url{font-size:0.7rem;color:#8a95a8;font-family:'DM Mono',monospace;flex:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.link-btn{background:none;border:1px solid #3a4258;border-radius:4px;color:#8a95a8;font-size:0.72rem;cursor:pointer;padding:3px 8px;white-space:nowrap;text-decoration:none;display:inline-block;}
.link-btn:hover{border-color:#7ecfaa;color:#7ecfaa;}
.link-btn.embed-on{border-color:#5a8fcc;color:#5a8fcc;}
.link-btn.del:hover{border-color:#cc4444;color:#cc4444;}
.add-form{display:flex;flex-direction:column;gap:6px;border-top:1px solid #3a4258;padding-top:10px;margin-top:auto;flex-shrink:0;}
.add-form input{background:#1c2030;border:1px solid #3a4258;border-radius:5px;color:#e8eaf0;font-family:'DM Sans',sans-serif;font-size:0.83rem;padding:7px 10px;}
.add-form input:focus{outline:none;border-color:#7ecfaa;}
.add-form input::placeholder{color:#4a5570;}
.add-row{display:flex;gap:8px;align-items:center;}
.btn-add{background:#1a5276;border:none;color:#fff;padding:7px 16px;border-radius:5px;cursor:pointer;font-size:0.82rem;font-family:'DM Sans',sans-serif;font-weight:500;white-space:nowrap;}
.btn-add:hover{background:#1f6694;}
.empty-msg{font-size:0.8rem;color:#4a5570;text-align:center;padding:20px 0;}
.resource-item{background:#1c2030;border:1px solid #3a4258;border-radius:6px;overflow:hidden;flex-shrink:0;margin-top:4px;}
.resource-embed{width:100%;border:none;display:block;}
.resource-embed-img{width:100%;max-height:400px;object-fit:contain;display:block;background:#0f1117;}
.resource-no-embed{padding:12px;font-size:0.78rem;color:#8a95a8;}
.resource-no-embed a{color:#5a8fcc;text-decoration:none;}
/* Non-maths cells — now draggable */
.cell-other,.cell-ped,.cell-exam-other{cursor:grab;}
.cell-other:active,.cell-ped:active,.cell-exam-other:active{cursor:grabbing;opacity:0.8;}
.cell-other.drag-over,.cell-ped.drag-over,.cell-exam-other.drag-over{outline:2px dashed #7ecfaa;outline-offset:-2px;}
.cell-other.cut-mode,.cell-ped.cut-mode,.cell-exam-other.cut-mode{outline:2px dashed #f0a830;outline-offset:-2px;animation:pulse-cut 1s infinite;}
/* Cell edit modal */
#ce-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:200;align-items:center;justify-content:center;}
#ce-overlay.open{display:flex;}
#ce-modal{background:#1e2336;border:1px solid #4a5570;border-radius:10px;padding:20px;min-width:300px;max-width:380px;width:90%;display:flex;flex-direction:column;gap:14px;}
#ce-modal-title{font-size:0.88rem;font-weight:600;color:#e8eaf0;font-family:'DM Mono',monospace;margin:0;}
.ce-field-label{font-size:0.7rem;color:#8a95a8;font-family:'DM Mono',monospace;margin-bottom:4px;}
#ce-label-input{background:#12151f;border:1px solid #3a4258;border-radius:5px;color:#e8eaf0;font-size:0.87rem;padding:7px 10px;width:100%;font-family:'DM Sans',sans-serif;}
#ce-label-input:focus{outline:none;border-color:#7ecfaa;}
.ce-type-row{display:flex;gap:8px;flex-wrap:wrap;}
.ce-type-btn{padding:6px 14px;border-radius:6px;border:2px solid transparent;cursor:pointer;font-size:0.78rem;font-family:'DM Mono',monospace;font-weight:600;transition:border-color 0.15s,box-shadow 0.15s;opacity:0.75;}
.ce-type-btn.selected{opacity:1;box-shadow:0 0 0 2px #7ecfaa;}
.ce-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:2px;}
.ce-btn-save{background:#1a6b4a;border:none;color:#fff;padding:7px 20px;border-radius:6px;cursor:pointer;font-size:0.83rem;font-family:'DM Sans',sans-serif;font-weight:500;}
.ce-btn-save:hover{background:#228b5e;}
.ce-btn-cancel{background:none;border:1px solid #4a5570;color:#8a95a8;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:0.83rem;font-family:'DM Sans',sans-serif;}
.ce-btn-cancel:hover{border-color:#8a95a8;}
</style>
</head>
<body>
<a class="back-link" href="index.html">&#x2190; All plans</a>
<h1 id="page-title">Loading&#x2026;</h1>
<p class="subtitle" id="page-subtitle"></p>
<div id="loading-state">Loading plan&#x2026;</div>

<div id="planner" style="display:none">
  <div class="legend" id="legend"></div>
  <div class="nav">
    <button id="btnPrev">&#x2190; Prev</button>
    <span class="week-label" id="weekLabel"></span>
    <button id="btnNext">Next &#x2192;</button>
    <span class="week-range" id="weekRange"></span>
    <span class="save-indicator" id="save-indicator"></span>
    <div class="zoom-controls">
      <button id="btnZoomOut" title="Zoom out">&#x2212;</button>
      <span id="zoomLabel">100%</span>
      <button id="btnZoomIn" title="Zoom in">&#x2b;</button>
    </div>
  </div>
  <div class="grid-wrap"><div class="grid" id="grid"></div></div>
</div>

<div id="drag-ghost"></div>

<!-- Cell edit modal -->
<div id="ce-overlay">
  <div id="ce-modal">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div id="ce-modal-title">Edit cell</div>
      <button id="ce-close" style="background:none;border:none;color:#8a95a8;font-size:1.2rem;cursor:pointer;line-height:1;padding:0 2px;">&#x2715;</button>
    </div>
    <div>
      <div class="ce-field-label">Label</div>
      <input id="ce-label-input" type="text" autocomplete="off">
    </div>
    <div>
      <div class="ce-field-label">Type / Colour</div>
      <div class="ce-type-row">
        <button class="ce-type-btn" data-type="other" style="background:#1c2030;color:#8a95b8;border-color:#3a4258;">Other</button>
        <button class="ce-type-btn" data-type="ped" style="background:#2a1f0a;color:#f0a830;border-color:#d4870a;">P&#x2019;Ed</button>
        <button class="ce-type-btn" data-type="exam" style="background:#2a1018;color:#e07070;border-color:#8b2020;">Exam</button>
      </div>
    </div>
    <div class="ce-actions">
      <button id="ce-save" class="ce-btn-save">Save</button>
      <button id="ce-cancel" class="ce-btn-cancel">Cancel</button>
    </div>
  </div>
</div>

<div id="panel-overlay"></div>
<div id="lesson-panel">
  <div id="panel-header">
    <span id="panel-klp-ref"></span>
    <span id="panel-klp-title"></span>
    <span id="panel-period"></span>
    <button class="panel-hdr-btn" id="panel-done-btn">&#x2713; Done</button>
    <button class="panel-hdr-btn" id="panel-cut-btn">&#x2702; Move</button>
    <button id="panel-close">&#x2715;</button>
  </div>
  <div id="panel-override-row">
    <input id="panel-override-input" type="text" placeholder="Override label for this slot only (blank = use default)">
    <button class="btn-add" id="panel-override-save" style="padding:5px 14px;">Set</button>
    <button class="link-btn" id="panel-override-clear">Clear</button>
  </div>
  <div id="panel-tabs">
    <div class="panel-tab active" data-tab="book">&#x1F4D6; Book</div>
    <div class="panel-tab" data-tab="notes">&#x1F4DD; Notes</div>
    <div class="panel-tab" data-tab="links">&#x1F517; Links &amp; Resources</div>
    <div class="panel-tab" data-tab="lessonplan">&#x1F4CB; Lesson Plan</div>
    <a id="panel-book-link" href="#" target="_blank">&#x2197; Full book</a>
  </div>
  <div id="panel-body">
    <iframe id="panel-book-frame" class="active" sandbox="allow-same-origin allow-scripts"></iframe>
    <div id="panel-notes-tab">
      <div id="panel-notes-label">Notes — shared across all intakes for this period</div>
      <textarea id="panel-notes" placeholder="Teaching notes, student feedback, pace adjustments…"></textarea>
      <div class="notes-actions">
        <button class="btn-save" id="panel-save-btn">Save notes</button>
        <span class="tab-status" id="panel-save-status"></span>
      </div>
    </div>
    <div id="panel-links-tab">
      <div id="links-list"></div>
      <div class="add-form">
        <input id="link-input-label" type="text" placeholder="Label (e.g. Khan Academy — BIDMAS)">
        <div class="add-row">
          <input id="link-input-url" type="url" placeholder="https://…" style="flex:1">
          <button class="btn-add" id="links-add-btn">Add link</button>
        </div>
        <div style="font-size:0.7rem;color:#4a5570;font-family:'DM Mono',monospace;">Toggle &#x1F4CC; Embed on any link to display it inline</div>
        <span class="tab-status" id="links-status"></span>
      </div>
    </div>
    <div id="panel-lp-tab">
      <div id="panel-lp-set-row">
        <input id="lp-url-input" type="url" placeholder="Lesson plan PDF URL…">
        <button class="btn-add" id="lp-url-save">Set PDF</button>
        <button class="link-btn" id="lp-url-clear">Clear</button>
        <span class="tab-status" id="lp-status"></span>
      </div>
      <iframe id="panel-lp-frame" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
    </div>
  </div>
</div>

<script>
const _sb = supabase.createClient(
  'https://znaqeoqgpqrsifmbmijf.supabase.co',
  'sb_publishable_L8g1B1mvRFqMSS3zGyukzA_da38oc-4'
);
const planSlug = new URLSearchParams(window.location.search).get('plan');

// ── Helpers ───────────────────────────────────────────────────────────────────
function klpLabel(section, pEnd) {
  const map = KLP_MAPS[section];
  return (map && map[pEnd]) || ('P' + pEnd);
}
function fmtDate(s) {
  return new Date(s + 'T12:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short'});
}
function klpRefsForEntry(entry) {
  const map = PERIOD_KLP_MAP[entry.section];
  if (!map) return [];
  const ref = map[entry.pEnd];
  return ref ? [ref] : [];
}

// ── Weeks ─────────────────────────────────────────────────────────────────────
function getWeeks() {
  const dates = Object.keys(tData).map(k => k.split('_')[0]).filter(Boolean).sort();
  if (!dates.length) return [];
  const end = new Date(dates[dates.length-1] + 'T12:00:00');
  const weeks = [];
  let cur = new Date(dates[0] + 'T12:00:00');
  while (cur.getDay() !== 1) cur.setDate(cur.getDate() - 1);
  while (cur <= end) {
    const days = [];
    for (let i = 0; i < 5; i++) {
      const d = new Date(cur);
      d.setDate(d.getDate() + i);
      days.push(d.toISOString().split('T')[0]);
    }
    weeks.push({mon: new Date(cur), days});
    cur.setDate(cur.getDate() + 7);
  }
  return weeks;
}

function scheduleSave() {
  clearTimeout(saveTimer);
  const ind = document.getElementById('save-indicator');
  ind.textContent = 'Unsaved…'; ind.className = 'save-indicator saving';
  saveTimer = setTimeout(async () => {
    ind.textContent = 'Saving…';
    const {error} = await _sb.from('plans').update({timetable_data: tData}).eq('slug', planSlug);
    ind.textContent = error ? 'Save failed ⚠' : 'Saved ✓';
    ind.className = 'save-indicator saved';
    setTimeout(() => { ind.textContent = ''; ind.className = 'save-indicator'; }, 3000);
  }, 1500);
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  if (!WEEKS.length) return;
  const week = WEEKS[weekIdx];
  document.getElementById('weekLabel').textContent = 'w/c ' + week.mon.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
  document.getElementById('weekRange').textContent = fmtDate(week.days[0]) + ' – ' + fmtDate(week.days[4]);
  document.getElementById('btnPrev').disabled = weekIdx === 0;
  document.getElementById('btnNext').disabled = weekIdx === WEEKS.length - 1;

  const showSlots = SLOTS.filter(s =>
    s.id !== 'p5' || week.days.some(d => tData[d + '_p5'])
  );

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  // Header row
  const corner = document.createElement('div');
  corner.className = 'grid-header';
  corner.textContent = 'Slot';
  grid.appendChild(corner);
  DAYS.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'grid-header day-header';
    el.innerHTML = d + '<div class="date-sub">' + fmtDate(week.days[i]) + '</div>';
    grid.appendChild(el);
  });

  // Slot rows
  showSlots.forEach(slot => {
    const lbl = document.createElement('div');
    lbl.className = 'slot-label';
    lbl.innerHTML = '<span class="slot-name">' + slot.label + '</span><span class="slot-time">' + slot.time + '</span>';
    grid.appendChild(lbl);

    week.days.forEach(date => {
      const key = date + '_' + slot.id;
      const entry = tData[key];
      const cell = document.createElement('div');

      // Air day
      if (date in negatedDateMap) {
        if (slot.id === 'p1') {
          cell.className = 'cell cell-airday';
          cell.innerHTML = '<div class="cell-airday-label">&#x2708; ' + (negatedDateMap[date] || 'Off') + '</div>';
        } else {
          cell.className = 'cell cell-airday';
          cell.style.opacity = '0.3';
        }
        grid.appendChild(cell);
        return;
      }

      if (!entry) {
        // Empty cell — needs data-key so touch drops can target it
        cell.className = 'cell cell-empty';
        cell.dataset.key = key;
        cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drag-over'); });
        cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
        cell.addEventListener('drop', () => { cell.classList.remove('drag-over'); if (cutKey) { handleCutPaste(key); } else { handleDrop(key); } });
        cell.addEventListener('click', () => { if (cutKey) handleCutPaste(key); });

      } else if (entry.isMaths) {
        // Maths cell
        const sc = SEC_COLORS[entry.section] || SEC_COLORS.pt1;
        const lbl2 = entry.override || (entry.isExam ? entry.label : klpLabel(entry.section, entry.pEnd));
        const pLbl = 'P' + entry.pEnd;
        const isDone = !!entry.done;
        const isCut = key === cutKey;

        cell.className = 'cell cell-maths' + (isDone ? ' done' : '') + (isCut ? ' cut-mode' : '');
        if (entry.isExam) {
          cell.style.background = '#2a0808';
          cell.style.borderLeft = '4px solid #cc2222';
          cell.innerHTML = '<div class="cell-tag" style="background:#8b1a1a">&#x26A0; EXAM</div><div class="cell-main-exam">' + lbl2 + '</div><div class="cell-period-exam">' + pLbl + '</div>';
        } else {
          cell.style.background = sc.light;
          cell.style.borderLeft = '4px solid ' + sc.bg;
          cell.innerHTML = '<div class="cell-tag" style="background:' + sc.bg + '">' + SEC_LABELS[entry.section] + '</div><div class="cell-main">' + lbl2 + '</div><div class="cell-period">' + pLbl + '</div>' + (isDone ? '<div class="cell-done-badge">&#x2713; done</div>' : '');
        }
        cell.draggable = true;
        cell.dataset.key = key;
        let didDrag = false;
        cell.addEventListener('dragstart', e => { dragKey = key; didDrag = true; e.dataTransfer.effectAllowed = 'move'; });
        cell.addEventListener('dragend', () => { setTimeout(() => { didDrag = false; }, 50); });
        cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drag-over'); });
        cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
        cell.addEventListener('drop', () => { cell.classList.remove('drag-over'); if (cutKey) { handleCutPaste(key); } else { handleDrop(key); } });
        cell.addEventListener('click', () => {
          if (didDrag || _lpActive) return;
          if (cutKey) { handleCutPaste(key); return; }
          openPanel(Object.assign({}, entry, {key}));
        });
        addTouchDrag(cell, key);

      } else {
        // Non-maths cell
        const isPEd = entry.isPEd || /p['']?\s*ed/i.test(entry.label);
        const isOtherExam = entry.isNonMathsExam || /exam/i.test(entry.label);
        const isCutNM = key === cutKey;
        if (isPEd) {
          cell.className = 'cell cell-ped' + (isCutNM ? ' cut-mode' : '');
          cell.innerHTML = '<div class="cell-ped-label">' + entry.label + '</div>';
        } else if (isOtherExam) {
          cell.className = 'cell cell-exam-other' + (isCutNM ? ' cut-mode' : '');
          cell.innerHTML = '<div class="cell-exam-other-label">' + entry.label + '</div>';
        } else {
          cell.className = 'cell cell-other' + (isCutNM ? ' cut-mode' : '');
          cell.innerHTML = '<div class="cell-other-label">' + entry.label + '</div>';
        }
        cell.draggable = true;
        cell.dataset.key = key;
        let didDragNM = false;
        cell.addEventListener('dragstart', e => { dragKey = key; didDragNM = true; e.dataTransfer.effectAllowed = 'move'; });
        cell.addEventListener('dragend', () => { setTimeout(() => { didDragNM = false; }, 50); });
        cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drag-over'); });
        cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
        cell.addEventListener('drop', () => { cell.classList.remove('drag-over'); if (cutKey) { handleCutPaste(key); } else { handleDrop(key); } });
        cell.addEventListener('click', () => {
          if (didDragNM || _lpActive) return;
          if (cutKey) { handleCutPaste(key); return; }
          openCellEdit(key, entry);
        });
        addTouchDrag(cell, key);
      }

      grid.appendChild(cell);
    });
  });
}

// ── Drag/drop & cut-paste ─────────────────────────────────────────────────────
function handleDrop(targetKey) {
  if (!dragKey || dragKey === targetKey) { dragKey = null; return; }
  const src = tData[dragKey], tgt = tData[targetKey];
  if (src) {
    const [tDate, tSlot] = targetKey.split('_');
    const [sDate, sSlot] = dragKey.split('_');
    tData[targetKey] = Object.assign({}, src, {date: tDate, slot: tSlot});
    if (tgt) tData[dragKey] = Object.assign({}, tgt, {date: sDate, slot: sSlot});
    else delete tData[dragKey];
  }
  dragKey = null;
  render();
  scheduleSave();
}

function handleCutPaste(targetKey) {
  if (!cutKey || cutKey === targetKey) { cutKey = null; render(); return; }
  const src = tData[cutKey], tgt = tData[targetKey];
  if (src) {
    const [tDate, tSlot] = targetKey.split('_');
    const [sDate, sSlot] = cutKey.split('_');
    tData[targetKey] = Object.assign({}, src, {date: tDate, slot: tSlot});
    if (tgt) tData[cutKey] = Object.assign({}, tgt, {date: sDate, slot: sSlot});
    else delete tData[cutKey];
  }
  cutKey = null;
  render();
  scheduleSave();
}

// ── Touch long-press → cut mode ───────────────────────────────────────────────
// (Drag-and-drop can't coexist with native scroll on iOS; long-press activates
//  cut mode instead — tap the target cell to complete the move.)
let _wasTouchDrag = false;
let _lpActive = false; // true for ~400ms after long-press fires, suppresses click

function addTouchDrag(cell, key) {
  let moved = false, pressTimer = null;

  cell.addEventListener('touchstart', () => {
    moved = false;
    if (cutKey) return;
    pressTimer = setTimeout(() => {
      if (moved) return;
      if (navigator.vibrate) navigator.vibrate(50);
      _lpActive = true;
      setTimeout(() => { _lpActive = false; }, 400);
      cutKey = key;
      render();
      const ind = document.getElementById('save-indicator');
      ind.textContent = '✂ Held — tap any slot to move it there';
      ind.className = 'save-indicator saving';
    }, 500);
  }, {passive: true});

  cell.addEventListener('touchmove', () => {
    moved = true;
    clearTimeout(pressTimer);
  }, {passive: true});

  cell.addEventListener('touchend',    () => clearTimeout(pressTimer), {passive: true});
  cell.addEventListener('touchcancel', () => clearTimeout(pressTimer), {passive: true});
}

// ── Cell edit modal ───────────────────────────────────────────────────────────
let _ceKey = null;

function openCellEdit(key, entry) {
  _ceKey = key;
  const input = document.getElementById('ce-label-input');
  input.value = entry.label || '';

  const isPEd = entry.isPEd || /p['']?\s*ed/i.test(entry.label);
  const isOtherExam = entry.isNonMathsExam || /exam/i.test(entry.label);
  const currentType = isPEd ? 'ped' : (isOtherExam ? 'exam' : 'other');
  document.querySelectorAll('.ce-type-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.type === currentType);
  });

  document.getElementById('ce-overlay').classList.add('open');
  input.focus();
  input.select();
}

function closeCellEdit() {
  document.getElementById('ce-overlay').classList.remove('open');
  _ceKey = null;
}

function saveCellEdit() {
  if (!_ceKey) return;
  const newLabel = document.getElementById('ce-label-input').value.trim();
  const selType = (document.querySelector('.ce-type-btn.selected') || {}).dataset || {};
  const type = selType.type || 'other';
  if (tData[_ceKey]) {
    if (newLabel) tData[_ceKey].label = newLabel;
    tData[_ceKey].isPEd = (type === 'ped');
    tData[_ceKey].isNonMathsExam = (type === 'exam');
  }
  closeCellEdit();
  render();
  scheduleSave();
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function initPlan() {
  if (!planSlug) { document.getElementById('loading-state').textContent = 'No plan specified.'; return; }
  try {
    const {data: plan, error} = await _sb.from('plans').select('*').eq('slug', planSlug).single();
    if (error || !plan) { document.getElementById('loading-state').textContent = 'Plan not found: ' + planSlug + (error ? ' — ' + error.message : ''); return; }
    document.title = plan.profile + ' ' + plan.course_number + ' — Course Planner';
    document.getElementById('page-title').textContent = plan.profile + ' ' + plan.course_number + ' — Course Planner';
    const startFmt = new Date(plan.start_date + 'T12:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
    document.getElementById('page-subtitle').textContent = 'Starting ' + startFmt;
    tData = plan.timetable_data || {};
    negatedDateMap = {};
    (plan.negated_days || []).forEach(entry => {
      const lbl = (entry && entry.label) ? entry.label : 'Off';
      const dates = (entry && entry.dates) ? entry.dates : (typeof entry === 'string' ? [entry] : []);
      dates.forEach(d => { negatedDateMap[d] = lbl; });
    });
    WEEKS = getWeeks();
    const _today = new Date().toISOString().split('T')[0];
    const _todayWk = WEEKS.findIndex(w => w.days[0] <= _today && _today <= w.days[4]);
    weekIdx = _todayWk >= 0 ? _todayWk : (_today > (WEEKS[WEEKS.length-1]||{days:['']}).days[4] ? WEEKS.length-1 : 0);
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('planner').style.display = 'block';
    buildLegend();
    render();
    applyZoom();
  } catch(err) {
    document.getElementById('loading-state').textContent = 'Error loading plan: ' + err.message;
  }
}

document.getElementById('btnPrev').addEventListener('click', () => { weekIdx--; render(); });
document.getElementById('btnNext').addEventListener('click', () => { weekIdx++; render(); });
document.getElementById('btnZoomOut').addEventListener('click', () => { gridZoom = Math.max(0.4, +(gridZoom - 0.1).toFixed(1)); applyZoom(); });
document.getElementById('btnZoomIn').addEventListener('click',  () => { gridZoom = Math.min(2.0, +(gridZoom + 0.1).toFixed(1)); applyZoom(); });

initPlan();

// ── Panel ─────────────────────────────────────────────────────────────────────
function openPanel(entry) {
  const refs = klpRefsForEntry(entry);
  const primaryRef = refs[0] || null;
  const defaultTitle = entry.isExam ? entry.label : klpLabel(entry.section, entry.pEnd, entry.single);
  const pLbl = entry.single ? ('P' + entry.pEnd) : ('P' + (entry.pEnd-1) + '–P' + entry.pEnd);

  document.getElementById('panel-klp-ref').textContent = primaryRef || '';
  document.getElementById('panel-klp-title').textContent = entry.override || defaultTitle;
  document.getElementById('panel-period').textContent = pLbl;

  // Book
  const frame = document.getElementById('panel-book-frame');
  const bookFile = SECTION_BOOK_FILE[entry.section] || '';
  const sectionFile = primaryRef ? ('books/sections/' + entry.section + '/' + primaryRef + '.html') : null;
  if (sectionFile) {
    fetch(sectionFile).then(r => { frame.src = r.ok ? sectionFile : bookFile; }).catch(() => { frame.src = bookFile; });
  } else {
    frame.src = bookFile;
  }
  document.getElementById('panel-book-link').href = bookFile + (primaryRef ? '#klp-' + primaryRef.replace(/\./g, '-') : '');

  // Override
  const ovInput = document.getElementById('panel-override-input');
  ovInput.value = entry.override || '';
  ovInput.placeholder = defaultTitle;
  document.getElementById('panel-override-save').onclick = () => {
    const v = ovInput.value.trim();
    if (entry.key && tData[entry.key]) { tData[entry.key].override = v || undefined; }
    entry.override = v || undefined;
    document.getElementById('panel-klp-title').textContent = v || defaultTitle;
    render(); scheduleSave();
  };
  document.getElementById('panel-override-clear').onclick = () => {
    ovInput.value = '';
    if (entry.key && tData[entry.key]) delete tData[entry.key].override;
    entry.override = undefined;
    document.getElementById('panel-klp-title').textContent = defaultTitle;
    render(); scheduleSave();
  };

  // Done button
  const doneBtn = document.getElementById('panel-done-btn');
  doneBtn.textContent = entry.done ? '✓ Done ✓' : '✓ Done';
  doneBtn.classList.toggle('active', !!entry.done);
  doneBtn.onclick = () => {
    if (!entry.key) return;
    tData[entry.key].done = !tData[entry.key].done;
    entry.done = tData[entry.key].done;
    doneBtn.textContent = entry.done ? '✓ Done ✓' : '✓ Done';
    doneBtn.classList.toggle('active', entry.done);
    render(); scheduleSave();
  };

  // Move button
  document.getElementById('panel-cut-btn').onclick = () => {
    if (!entry.key) return;
    cutKey = entry.key;
    closePanel();
    render();
    const ind = document.getElementById('save-indicator');
    ind.textContent = '✂ Cut — click any target slot to move (any week)';
    ind.className = 'save-indicator saving';
  };

  // Notes
  const noteKey = 'note_' + entry.section + '_p' + entry.pEnd;
  _currentNoteKey = noteKey;
  loadNote(noteKey).then(content => {
    document.getElementById('panel-notes').value = content;
    document.getElementById('panel-save-status').textContent = '';
  });
  document.getElementById('panel-save-btn').onclick = () => saveNote(noteKey);

  // Links
  document.getElementById('link-input-label').value = '';
  document.getElementById('link-input-url').value = '';
  document.getElementById('links-status').textContent = '';
  refreshLinksTab(noteKey);

  // Lesson plan
  loadLessonPlan(noteKey);

  switchTab('book');
  document.getElementById('panel-overlay').classList.add('open');
  document.getElementById('lesson-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel-overlay').classList.remove('open');
  document.getElementById('lesson-panel').classList.remove('open');
}

function switchTab(tab) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  ['panel-book-frame','panel-notes-tab','panel-links-tab','panel-lp-tab'].forEach(id => {
    document.getElementById(id).classList.remove('active');
  });
  document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
  const map = {book:'panel-book-frame', notes:'panel-notes-tab', links:'panel-links-tab', lessonplan:'panel-lp-tab'};
  if (map[tab]) document.getElementById(map[tab]).classList.add('active');
}

// ── Notes ─────────────────────────────────────────────────────────────────────
const _noteCache = {};
async function loadNote(key) {
  if (_noteCache[key] !== undefined) return _noteCache[key];
  try {
    const {data} = await _sb.from('notes').select('content').eq('note_key', key).maybeSingle();
    const val = (data && data.content) || localStorage.getItem(key) || '';
    _noteCache[key] = val;
    return val;
  } catch(e) {
    return localStorage.getItem(key) || '';
  }
}
async function saveNote(key) {
  const content = document.getElementById('panel-notes').value;
  _noteCache[key] = content;
  localStorage.setItem(key, content);
  const s = document.getElementById('panel-save-status');
  s.textContent = 'Saving…';
  try {
    const {error} = await _sb.from('notes').upsert({note_key: key, content, updated_at: new Date().toISOString()}, {onConflict:'note_key'});
    s.textContent = error ? 'Local only ⚠' : 'Saved ✓';
  } catch(e) {
    s.textContent = 'Local only ⚠';
  }
  setTimeout(() => { s.textContent = ''; }, 3000);
}

// ── Links ─────────────────────────────────────────────────────────────────────
const _linksCache = {};
async function loadLinks(key) {
  if (_linksCache[key]) return _linksCache[key];
  try {
    const {data} = await _sb.from('links').select('*').eq('note_key', key).order('sort_order').order('created_at');
    _linksCache[key] = data || [];
    return _linksCache[key];
  } catch(e) { return []; }
}
async function addLink(key, label, url, embed) {
  const maxOrder = (_linksCache[key] || []).reduce((m, l) => Math.max(m, l.sort_order || 0), 0);
  const {data, error} = await _sb.from('links').insert({note_key: key, label, url, embed, sort_order: maxOrder + 1}).select().single();
  if (!error && data) { if (!_linksCache[key]) _linksCache[key] = []; _linksCache[key].push(data); }
  return {error};
}
async function deleteLink(id, key) {
  await _sb.from('links').delete().eq('id', id);
  if (_linksCache[key]) _linksCache[key] = _linksCache[key].filter(l => l.id !== id);
}
async function toggleEmbed(id, key, newVal) {
  await _sb.from('links').update({embed: newVal}).eq('id', id);
  if (_linksCache[key]) { const item = _linksCache[key].find(l => l.id === id); if (item) item.embed = newVal; }
}

function youtubeEmbedUrl(url) {
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? 'https://www.youtube.com/embed/' + m[1] : null;
}
function isImage(url) { return /\.(png|jpe?g|gif|svg|webp)(\?.*)?$/i.test(url); }
function isPdf(url) { return /\.pdf(\?.*)?$/i.test(url); }

function embedHtml(l) {
  const ytUrl = youtubeEmbedUrl(l.url);
  if (isImage(l.url)) return '<img class="resource-embed-img" src="' + l.url + '" alt="' + l.label + '" loading="lazy">';
  if (ytUrl) return '<iframe class="resource-embed" src="' + ytUrl + '" height="240" allowfullscreen></iframe>';
  if (isPdf(l.url)) return '<iframe class="resource-embed" src="' + l.url + '" height="360"></iframe>';
  return '<div class="resource-no-embed">&#x26A0; Cannot embed — <a href="' + l.url + '" target="_blank">open in new tab</a></div>';
}

function renderLinksList(links, key) {
  const list = document.getElementById('links-list');
  if (!links.length) { list.innerHTML = '<div class="empty-msg">No links yet — add one below</div>'; return; }
  list.innerHTML = links.map(l => {
    const emb = l.embed ? '<div class="resource-item">' + embedHtml(l) + '</div>' : '';
    return '<div class="link-item" data-id="' + l.id + '">' +
      '<span class="link-item-label" title="' + l.label + '">' + l.label + '</span>' +
      '<span class="link-item-url" title="' + l.url + '">' + l.url + '</span>' +
      '<a href="' + l.url + '" target="_blank" class="link-btn">Open</a>' +
      '<button class="link-btn embed-btn' + (l.embed ? ' embed-on' : '') + '">' + (l.embed ? '&#x1F4CC; On' : '&#x1F4CC; Embed') + '</button>' +
      '<button class="link-btn del del-btn">&#x2715;</button>' +
      '</div>' + emb;
  }).join('');
  list.querySelectorAll('.del-btn').forEach((btn, i) => {
    btn.addEventListener('click', async () => { await deleteLink(links[i].id, key); renderLinksList(_linksCache[key] || [], key); });
  });
  list.querySelectorAll('.embed-btn').forEach((btn, i) => {
    btn.addEventListener('click', async () => { const nv = !links[i].embed; await toggleEmbed(links[i].id, key, nv); renderLinksList(_linksCache[key] || [], key); });
  });
}

async function refreshLinksTab(key) {
  const links = await loadLinks(key);
  renderLinksList(links, key);
}

// ── Lesson Plan ───────────────────────────────────────────────────────────────
const _lpCache = {};
async function loadLessonPlan(key) {
  const lpKey = 'lp_' + key;
  if (_lpCache[lpKey] !== undefined) { applyLpUrl(_lpCache[lpKey]); return; }
  try {
    const {data} = await _sb.from('notes').select('content').eq('note_key', lpKey).maybeSingle();
    const url = (data && data.content) || '';
    _lpCache[lpKey] = url;
    applyLpUrl(url);
  } catch(e) { applyLpUrl(''); }
}
function applyLpUrl(url) {
  document.getElementById('lp-url-input').value = url;
  const frame = document.getElementById('panel-lp-frame');
  if (url) { frame.src = url; frame.classList.add('active'); }
  else { frame.src = ''; frame.classList.remove('active'); }
  document.getElementById('lp-status').textContent = '';
}
</script>

<script>
// Second block: listeners that require DOM elements to exist
// Cell edit modal listeners
document.getElementById('ce-close').addEventListener('click', closeCellEdit);
document.getElementById('ce-cancel').addEventListener('click', closeCellEdit);
document.getElementById('ce-overlay').addEventListener('click', e => { if (e.target.id === 'ce-overlay') closeCellEdit(); });
document.getElementById('ce-save').addEventListener('click', saveCellEdit);
document.getElementById('ce-label-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveCellEdit(); if (e.key === 'Escape') closeCellEdit(); });
document.querySelectorAll('.ce-type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ce-type-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  });
});

document.getElementById('panel-close').addEventListener('click', closePanel);
document.getElementById('panel-overlay').addEventListener('click', closePanel);
document.querySelectorAll('.panel-tab').forEach(t => { t.addEventListener('click', () => switchTab(t.dataset.tab)); });

document.getElementById('links-add-btn').addEventListener('click', async () => {
  const label = document.getElementById('link-input-label').value.trim();
  const url   = document.getElementById('link-input-url').value.trim();
  const status = document.getElementById('links-status');
  if (!url) { status.textContent = 'Please enter a URL'; return; }
  status.textContent = 'Saving…';
  const {error} = await addLink(_currentNoteKey, label || url, url, false);
  if (error) { status.textContent = 'Error ⚠'; return; }
  document.getElementById('link-input-label').value = '';
  document.getElementById('link-input-url').value = '';
  status.textContent = 'Added ✓';
  setTimeout(() => { status.textContent = ''; }, 2000);
  renderLinksList(_linksCache[_currentNoteKey] || [], _currentNoteKey);
});

document.getElementById('link-input-url').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('links-add-btn').click();
});

document.getElementById('lp-url-save').addEventListener('click', async () => {
  const url = document.getElementById('lp-url-input').value.trim();
  const lpKey = 'lp_' + _currentNoteKey;
  const status = document.getElementById('lp-status');
  status.textContent = 'Saving…';
  const {error} = await _sb.from('notes').upsert({note_key: lpKey, content: url, updated_at: new Date().toISOString()}, {onConflict:'note_key'});
  if (!error) { _lpCache[lpKey] = url; applyLpUrl(url); status.textContent = 'Saved ✓'; }
  else { status.textContent = 'Error ⚠'; }
  setTimeout(() => { status.textContent = ''; }, 2500);
});

document.getElementById('lp-url-clear').addEventListener('click', async () => {
  const lpKey = 'lp_' + _currentNoteKey;
  await _sb.from('notes').upsert({note_key: lpKey, content: '', updated_at: new Date().toISOString()}, {onConflict:'note_key'});
  _lpCache[lpKey] = '';
  applyLpUrl('');
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/Planner/sw.js').catch(() => {});
}
</script>
