.grid-wrap{overflow-x:auto;}
.grid-header{background:#1e2336;padding:9px 6px;font-size:0.72rem;color:#8a95a8;font-family:'DM Mono',monospace;text-align:center;border-bottom:2px solid #3a4258;}

.cell{min-height:80px;padding:7px;transition:all 0.1s;position:relative;}
.cell-empty{background:#12151f;}
.cell-other{background:#1c2030;display:flex;align-items:center;justify-content:center;}

/* ── LESSON PANEL ── */
#panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;}
#panel-overlay.open{display:block;}
#lesson-panel{
  position:fixed;top:0;right:-740px;width:min(740px,100vw);height:100vh;
  background:#12151f;border-left:2px solid #3a4258;
  display:flex;flex-direction:column;z-index:101;
  transition:right 0.25s ease;
}
#lesson-panel.open{right:0;}
#panel-header{

#panel-close:hover{color:#e8eaf0;}
#panel-tabs{display:flex;align-items:stretch;background:#181c28;border-bottom:1px solid #3a4258;flex-shrink:0;}
.panel-tab{padding:8px 16px;font-size:0.78rem;cursor:pointer;color:#8a95a8;border-bottom:2px solid transparent;font-weight:500;white-space:nowrap;}
.panel-tab.active{color:#7ecfaa;border-bottom-color:#7ecfaa;}
#panel-book-link{margin-left:auto;align-self:center;padding:0 14px;font-size:0.73rem;color:#5a8fcc;text-decoration:none;}
#panel-book-link:hover{color:#7ecfaa;}
#panel-body{flex:1;overflow:hidden;display:flex;flex-direction:column;}
#panel-book-frame{width:100%;flex:1;border:none;display:none;background:#fff;}

#panel-notes-tab{display:none;flex-direction:column;flex:1;padding:14px;}

#panel-notes-label{font-size:0.72rem;color:#8a95a8;margin-bottom:8px;font-family:'DM Mono',monospace;}

function getWeeks() {
  const weeks = [];
  const start = new Date('2026-06-08T12:00:00');
  const end   = new Date('2026-08-14T12:00:00');
  let cur = new Date(start);
  while (cur <= end) {
    const days = [];
    for (let i=0;i<5;i++) {
      const d = new Date(cur); d.setDate(d.getDate()+i);
      days.push(d.toISOString().split('T')[0]);
    }
    weeks.push({mon:new Date(cur), days});
    cur.setDate(cur.getDate()+7);
  }
  return weeks;
}
const WEEKS = getWeeks();

function fmtDate(s) {
  const d = new Date(s+'T12:00:00');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

function render() {
  const week = WEEKS[weekIdx];

  document.getElementById('weekLabel').textContent = 'w/c '+week.mon.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  document.getElementById('weekRange').textContent = fmtDate(week.days[0])+' – '+fmtDate(week.days[4]);
  document.getElementById('btnPrev').disabled = weekIdx===0;
  document.getElementById('btnNext').disabled = weekIdx===WEEKS.length-1;

  const showSlots = SLOTS.filter(s => {
    if (s.id==='lunch') return week.days.some(d => data[d+'_lunch']);
    return true;
  });

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  grid.style.gridTemplateColumns = '80px repeat(5,1fr)';

  const cornerEl = document.createElement('div');
  cornerEl.className = 'grid-header';
  cornerEl.textContent = 'Slot';
  grid.appendChild(cornerEl);
  DAYS.forEach((d,i) => {
    const el = document.createElement('div');
    el.className = 'grid-header day-header';
    el.innerHTML = d+'<div class="date-sub">'+fmtDate(week.days[i])+'</div>';
    grid.appendChild(el);
  });

  showSlots.forEach(slot => {
    const lbl = document.createElement('div');
    lbl.className = 'slot-label';
    lbl.innerHTML = '<span class="slot-name">'+slot.label+'</span><span class="slot-time">'+slot.time+'</span>';
    grid.appendChild(lbl);

    week.days.forEach(date => {
      const key = date+'_'+slot.id;
      const entry = data[key];
      const cell = document.createElement('div');

      if (!entry) {
        cell.className = 'cell cell-empty';
        cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drag-over'); });
        cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
        cell.addEventListener('drop', () => { cell.classList.remove('drag-over'); handleDrop(key); });
      } else if (entry.isMaths) {
        const sc = SEC_COLORS[entry.section] || SEC_COLORS.pt1;
        const lbl2 = entry.isExam ? entry.label : klpLabel(entry.section, entry.pEnd, entry.single);
        const pLbl = entry.single ? 'P'+entry.pEnd : 'P'+(entry.pEnd-1)+'–P'+entry.pEnd;
        cell.className = 'cell cell-maths';
        if (entry.isExam) {
          cell.style.background = '#2a0808';
          cell.style.borderLeft = '4px solid #cc2222';
          cell.innerHTML =
            '<div class="cell-tag" style="background:#8b1a1a">⚠ EXAM</div>'+
            '<div class="cell-main-exam">'+lbl2+'</div>'+
            '<div class="cell-period-exam">'+pLbl+'</div>';
        } else {
          cell.style.background = sc.light;
          cell.style.borderLeft = '4px solid '+sc.bg;
          cell.innerHTML =
            '<div class="cell-tag" style="background:'+sc.bg+'">'+SEC_LABELS[entry.section]+'</div>'+
            '<div class="cell-main">'+lbl2+'</div>'+
            '<div class="cell-period">'+pLbl+'</div>';
        }
        cell.draggable = true;
        // Track whether we moved so click doesn't fire after drag
        let didDrag = false;
        cell.addEventListener('dragstart', e => { dragKey = key; didDrag = true; e.dataTransfer.effectAllowed='move'; });
        cell.addEventListener('dragend', () => { setTimeout(() => { didDrag = false; }, 50); });
        cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drag-over'); });
        cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
        cell.addEventListener('drop', () => { cell.classList.remove('drag-over'); handleDrop(key); });
        cell.addEventListener('click', () => { if (!didDrag) openPanel(Object.assign({},entry)); });
      } else {
        const isPEd = /p\s*ed/i.test(entry.label);
        const isOtherExam = /exam/i.test(entry.label);
        if (isPEd) {
          cell.className = 'cell cell-ped';
          cell.innerHTML = '<div class="cell-ped-label">'+entry.label+'</div>';
        } else if (isOtherExam) {
          cell.className = 'cell cell-exam-other';
          cell.innerHTML = '<div class="cell-exam-other-label">'+entry.label+'</div>';
        } else {
          cell.className = 'cell cell-other';
          cell.innerHTML = '<div class="cell-other-label">'+entry.label+'</div>';
        }
        cell.addEventListener('dragover', e => { e.preventDefault(); });
        cell.addEventListener('drop', () => handleDrop(key));
      }

      grid.appendChild(cell);
    });
  });
}

function handleDrop(targetKey) {
  if (!dragKey || dragKey === targetKey) { dragKey=null; return; }
  const src = data[dragKey];
  const tgt = data[targetKey];
  if (src) {
    const [tDate,tSlot] = targetKey.split('_');
    const [sDate,sSlot] = dragKey.split('_');
    data[targetKey] = Object.assign({},src,{date:tDate,slot:tSlot});
    if (tgt) data[dragKey] = Object.assign({},tgt,{date:sDate,slot:sSlot});
    else delete data[dragKey];
  }
  dragKey = null;
  render();
}

// ── LESSON PANEL LOGIC ────────────────────────────────────────────────────────
function klpRefsForEntry(entry) {
  const map = PERIOD_KLP_MAP[entry.section];
  if (!map) return [];
  const refs = [];
  const add = r => { if (r && !refs.includes(r)) refs.push(r); };
  if (entry.single) {
    add(map[entry.pEnd]);
  } else {
    add(map[entry.pEnd - 1]);
    add(map[entry.pEnd]);
  }
  return refs;
}

async function openPanel(entry) {
  const refs = klpRefsForEntry(entry);
  const primaryRef = refs[0] || null;
  const desc = primaryRef ? (KLP_REF_DESC[primaryRef] || entry.label) : entry.label;
  const pLbl = entry.single ? 'P'+entry.pEnd : 'P'+(entry.pEnd-1)+'\u2013P'+entry.pEnd;

  document.getElementById('panel-klp-ref').textContent = primaryRef || '';
  document.getElementById('panel-klp-title').textContent = desc;
  document.getElementById('panel-period').textContent = pLbl;

  // Book iframe
  const frame = document.getElementById('panel-book-frame');
  const bookFile = SECTION_BOOK_FILE[entry.section] || '';
  const sectionFile = primaryRef
    ? 'books/sections/'+entry.section+'/'+primaryRef+'.html'
    : null;

  if (sectionFile) {
    fetch(sectionFile)
      .then(r => { frame.src = r.ok ? sectionFile : bookFile + (primaryRef ? '#klp-'+primaryRef.replace(/\./g,'-') : ''); })
      .catch(() => { frame.src = bookFile; });
  } else {
    frame.src = bookFile;
  }

  // Book link
  const anchor = primaryRef ? '#klp-'+primaryRef.replace(/\./g,'-') : '';
  const link = document.getElementById('panel-book-link');
  link.href = bookFile + anchor;

  // Notes
  const noteKey = 'note_'+entry.section+'_p'+entry.pEnd;
  document.getElementById('panel-notes').value = await loadNote(noteKey);
  document.getElementById('panel-save-status').textContent = '';
  document.getElementById('panel-save-btn').onclick = () => saveNote(noteKey);

  switchTab('book');
  document.getElementById('panel-overlay').classList.add('open');
  document.getElementById('lesson-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel-overlay').classList.remove('open');
  document.getElementById('lesson-panel').classList.remove('open');
}

function switchTab(tab) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-book-frame').classList.remove('active');
  document.getElementById('panel-notes-tab').classList.remove('active');
  if (tab === 'book') {
    document.querySelector('[data-tab="book"]').classList.add('active');
    document.getElementById('panel-book-frame').classList.add('active');
  } else {
    document.querySelector('[data-tab="notes"]').classList.add('active');
    document.getElementById('panel-notes-tab').classList.add('active');
  }
}

// ── NOTES STORAGE — Supabase ─────────────────────────────────────────────────
const _sb = supabase.createClient(
  'https://znaqeoqgpqrsifmbmijf.supabase.co',
  'sb_publishable_L8g1B1mvRFqMSS3zGyukzA_da38oc-4'
);

const _noteCache = {};

async function loadNote(key) {
  if (_noteCache[key] !== undefined) return _noteCache[key];
  try {
    const { data } = await _sb.from('notes').select('content').eq('note_key', key).maybeSingle();
    const val = (data && data.content) || localStorage.getItem(key) || '';
    _noteCache[key] = val;
    return val;
  } catch {
    return localStorage.getItem(key) || '';
  }
}

async function saveNote(key) {
  const content = document.getElementById('panel-notes').value;
  _noteCache[key] = content;
  localStorage.setItem(key, content);
  const s = document.getElementById('panel-save-status');
  s.textContent = 'Saving…';
  try {
    const { error } = await _sb.from('notes')
      .upsert({ note_key: key, content, updated_at: new Date().toISOString() },
               { onConflict: 'note_key' });
    s.textContent = error ? 'Local only ⚠' : 'Saved ✓';
  } catch {
    s.textContent = 'Local only ⚠';
  }
  setTimeout(() => { s.textContent = ''; }, 3000);
}

document.getElementById('panel-close').addEventListener('click', closePanel);
document.getElementById('panel-overlay').addEventListener('click', closePanel);
document.querySelectorAll('.panel-tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});
</script>
